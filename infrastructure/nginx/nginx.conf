events {
    worker_processes auto;
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Kích thước tối đa upload (đồng bộ với MAX_CONTENT_LENGTH_MB trong .env)
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    upstream flask_backend {
        server backend:5000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # --- Frontend React (SPA) ---
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            # SPA fallback: mọi route đều trả index.html
            try_files $uri $uri/ /index.html;
        }

        # --- Backend API Proxy ---
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://flask_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection         "";
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;

            # Timeout đủ dài cho AI inference (OCR, Gemini chat)
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # --- Auth endpoints: rate limit chặt hơn ---
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass         http://flask_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # --- Static uploads ---
        location /uploads/ {
            alias /app/uploads/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # --- Health Check (bypass rate limit) ---
        location /health {
            proxy_pass http://flask_backend/health;
            access_log off;
        }
    }
}
